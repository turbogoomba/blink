# ~/.config/kitty/kitty.conf
allow_remote_control socket-only
listen_on unix:/tmp/kitty

# --- Colors -------------------------------------------------
# pywal palette (background, accents)
include ~/.cache/wal/colors-kitty.conf

# Keep text white regardless of wallpaper (must come AFTER include)
background #1c1c1e
foreground            #ffffff
selection_foreground  #ffffff
selection_background #3a3a3c

# --- Font ---------------------------------------------------
# SF Mono-like. Swap the comment to go back to JetBrains.
font_family      SF Mono
# font_family    JetBrains Mono
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        12.0
adjust_line_height 110%

# --- Transparency (blur comes from Hyprland) ----------------
background_opacity         0.70
dynamic_background_opacity yes

# --- Window -------------------------------------------------
window_padding_width     14
hide_window_decorations  yes
confirm_os_window_close  0
enable_audio_bell        no

# --- Cursor -------------------------------------------------
cursor_shape           beam
cursor_beam_thickness  1.5
cursor_blink_interval  0.5
cursor_trail           3

# --- Tabs ---------------------------------------------------
tab_bar_edge         top
tab_bar_style        powerline
tab_powerline_style  round
tab_title_template   " {index}: {title} "

# --- Misc ---------------------------------------------------
url_style   curly
copy_on_select yes
scrollback_lines 10000
