# Which program answers apps' requests (xdg-desktop-portal) under Hyprland.
# Open/Save dialogs use the GTK (GNOME, same as Nautilus) one, not KDE's,
# even though KDE is installed. Screen sharing stays with Hyprland's portal.
[preferred]
default=hyprland;gtk
org.freedesktop.impl.portal.FileChooser=gtk
org.freedesktop.impl.portal.OpenURI=gtk
org.freedesktop.impl.portal.AppChooser=gtk
