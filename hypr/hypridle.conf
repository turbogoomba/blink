# Blink idle rules (hypridle)
#  5 min: dim the screen
# 10 min: lock
# 11 min: screen off
# 30 min: sleep, but only on battery

general {
    lock_cmd = qs -c blink ipc call lock lock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms("on")'
}

# Dim (laptop screen; does nothing on a desktop without a backlight)
listener {
    timeout = 300
    on-timeout = brightnessctl -s set 20%
    on-resume = brightnessctl -r
}

# Lock
listener {
    timeout = 600
    on-timeout = loginctl lock-session
}

# Screen off
listener {
    timeout = 660
    on-timeout = hyprctl dispatch 'hl.dsp.dpms("off")'
    on-resume = hyprctl dispatch 'hl.dsp.dpms("on")'
}

# Sleep when on battery
listener {
    timeout = 1800
    on-timeout = sh -c 'grep -qs 0 /sys/class/power_supply/A*/online && systemctl suspend'
}
