# Mac Rice lock screen (hyprlock)
# Same look as the login screen: blurred background, date, big clock,
# avatar, name and a password pill at the bottom.

general {
    hide_cursor = true
    ignore_empty_input = true
}

# ---------- Background ----------
background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 10
    brightness = 0.7
    vibrancy = 0.15
}

# ---------- Status (top right) ----------
label {
    monitor =
    text = cmd[update:30000] cat /sys/class/power_supply/BAT*/capacity 2>/dev/null | sed 's/$/%/'
    color = rgba(229, 229, 231, 0.85)
    font_size = 13
    font_family = IBM Plex Sans
    position = -24, -16
    halign = right
    valign = top
}

# ---------- Date ----------
label {
    monitor =
    text = cmd[update:60000] date +"%A %-d %B"
    color = rgba(229, 229, 231, 0.85)
    font_size = 22
    font_family = IBM Plex Sans Medium
    position = 0, -96
    halign = center
    valign = top
}

# ---------- Clock ----------
label {
    monitor =
    text = $TIME
    color = rgba(242, 242, 244, 1.0)
    font_size = 136
    font_family = IBM Plex Sans Light
    position = 0, -130
    halign = center
    valign = top
}

# ---------- Now playing (only shows when something plays) ----------
label {
    monitor =
    text = cmd[update:2000] t=$(playerctl metadata title 2>/dev/null) && echo "$t  ·  $(playerctl metadata artist)"
    color = rgba(229, 229, 231, 0.75)
    font_size = 14
    font_family = IBM Plex Sans
    position = 0, -330
    halign = center
    valign = top
}

# ---------- Avatar ----------
shape {
    monitor =
    size = 64, 64
    rounding = -1
    color = rgba(58, 58, 60, 1.0)
    border_size = 1
    border_color = rgba(255, 255, 255, 0.12)
    position = 0, 172
    halign = center
    valign = bottom
}

label {
    monitor =
    text = H
    color = rgba(229, 229, 231, 1.0)
    font_size = 26
    font_family = IBM Plex Sans Medium
    position = 0, 186
    halign = center
    valign = bottom
}

# ---------- Name ----------
label {
    monitor =
    text = Herman
    color = rgba(229, 229, 231, 1.0)
    font_size = 15
    font_family = IBM Plex Sans SemiBold
    position = 0, 136
    halign = center
    valign = bottom
}

# ---------- Password ----------
input-field {
    monitor =
    size = 230, 36
    outline_thickness = 1
    rounding = -1

    outer_color = rgba(255, 255, 255, 0.14)
    inner_color = rgba(255, 255, 255, 0.12)
    font_color = rgba(229, 229, 231, 1.0)
    check_color = rgba(95, 168, 211, 0.8)
    fail_color = rgba(255, 105, 97, 0.55)

    font_family = IBM Plex Sans
    placeholder_text = <span foreground="##e5e5e799">Enter Password</span>
    fail_text = Wrong password

    dots_size = 0.22
    dots_spacing = 0.35
    dots_center = true
    fade_on_empty = false
    hide_input = false

    position = 0, 84
    halign = center
    valign = bottom
}
